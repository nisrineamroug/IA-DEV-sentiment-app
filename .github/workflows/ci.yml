name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt -r requirements-dev.txt
      - run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - run: . .venv/bin/activate && ruff check .
      - run: . .venv/bin/activate && mypy api sentiment_app
      - run: . .venv/bin/activate && pytest -q
