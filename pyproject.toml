[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "0.6.0"
description = "Application de classification de sentiment"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "requests>=2.32",
]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools.packages.find]
include = ["api*", "sentiment_app*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
